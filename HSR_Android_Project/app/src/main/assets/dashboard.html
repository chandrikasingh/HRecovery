<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1976d2"/>
<title>Himanshu Recovery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="top">
  <div class="brand"><div class="logo">🚗</div><div>
    <div class="title">Himanshu Recovery</div>
    <div class="sub">Offline Vehicle Recovery Lookup</div>
  </div></div>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>Records</span></div>
    <div class="stat"><b id="matches">0</b><span>Search results</span></div>
    <div class="stat"><b>OFFLINE</b><span>Data mode</span></div>
  </div>
</div>

<div class="wrap" id="home">
  <div class="card">
    <div class="searchrow">
      <input id="q" placeholder="Search vehicle number" autocomplete="off">
      <button class="btn" id="search">Search</button>
    </div>

<div class="hint">
  Imported vehicle list is built into this app. Search by full or partial registration number.
</div>

<div class="actions">
      <button class="btn secondary" id="importBtn">Import CSV</button>
      <button class="btn secondary" id="clearBtn">Reset</button>
    </div>
    <input class="file" id="file" type="file" accept=".csv,.txt">
</div>

<div class="card">
    <h3 style="margin:0 0 10px">Vehicle Search</h3>
    <div id="results" class="results"></div>
  </div>
  <div class="footer">Himanshu Recovery • Local/offline prototype</div>
</div>

<div class="wrap" id="detail" style="display:none">
  <button class="back" id="back">← Back to search</button>
  <div class="card detail" id="detailCard"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/dash_info.js"></script>

</body>
</html>
